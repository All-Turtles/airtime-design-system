/* choose the view before first paint: ?view=eng|overview, else the remembered choice, else Overview */
(function () {
  var v = "overview";
  try {
    var q = new URLSearchParams(location.search).get("view"), s = null;
    try { s = localStorage.getItem("creator-ds-view"); } catch (e) {}
    if (q === "eng" || q === "overview") v = q; else if (s === "eng" || s === "overview") v = s;
  } catch (e) {}
  document.documentElement.setAttribute("data-view", v);
})();
</script>
